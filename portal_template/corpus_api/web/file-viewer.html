<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>语料文件查看器 · “中文+”语料库</title>
  <style>
    :root{--ink:#172234;--muted:#697487;--line:#dfe2df;--bg:#f3f1ec;--brand:#176a63;--navy:#111f31;--gold:#b88b55;--bad:#b1463b;--shadow:0 16px 46px rgba(21,34,49,.1)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 100% 0,#e8efec 0,transparent 35%),var(--bg);color:var(--ink);font:15px/1.7 "Microsoft YaHei UI",system-ui,sans-serif}.top{background:linear-gradient(105deg,var(--navy),#1a2d43);color:#fff}.top-inner{max-width:1280px;margin:auto;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:850;font-size:18px}.top a{color:#e8d5b8;text-decoration:none}.shell{max-width:1280px;margin:0 auto;padding:32px 26px 60px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px}.eyebrow{color:var(--brand);font-weight:800;font-size:12px;letter-spacing:.12em}.head h1{font-size:clamp(24px,4vw,36px);line-height:1.25;margin:5px 0 6px;word-break:break-all}.path{color:var(--muted);word-break:break-all}.actions{display:flex;gap:9px;flex-wrap:wrap}.button{display:inline-block;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:9px 14px;text-decoration:none;font-weight:750}.button.primary{background:var(--brand);border-color:var(--brand);color:#fff}.paper{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.meta{padding:12px 18px;background:#f6f6f3;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px}.content{margin:0;padding:24px 27px;min-height:65vh;max-height:calc(100vh - 230px);overflow:auto;white-space:pre-wrap;word-break:break-word;font:14px/1.9 "Microsoft YaHei UI",system-ui,sans-serif}.error{padding:28px;color:var(--bad)}@media(max-width:700px){.shell{padding:22px 14px}.top-inner{padding:14px}.head{display:block}.actions{margin-top:14px}.content{padding:18px;max-height:none}}
  </style>
  <link rel="stylesheet" href="/assets/ui-polish.css?v=2">
</head>
<body>
  <header class="top"><div class="top-inner"><div class="brand">“中文+”语料库 · 文件查看器</div><a href="/">返回操作台</a></div></header>
  <main class="shell">
    <section class="head"><div><div class="eyebrow">FILE PREVIEW</div><h1 id="filename">正在读取文件……</h1><div id="path" class="path"></div></div><div class="actions"><a class="button" href="/">返回操作台</a><a id="download" class="button primary" href="#">下载原文件</a></div></section>
    <article class="paper"><div id="meta" class="meta">正在安全读取预览内容……</div><pre id="content" class="content"></pre></article>
  </main>
  <script>
    const params=new URLSearchParams(location.search),path=params.get('path')||'',filename=path.split('/').pop()||'未指定文件';
    document.title=`${filename} · 文件查看器`;document.querySelector('#filename').textContent=filename;document.querySelector('#path').textContent=path;document.querySelector('#download').href='/api/download?path='+encodeURIComponent(path);
    (async()=>{try{if(!path)throw new Error('没有指定需要查看的文件');const response=await fetch('/api/preview?path='+encodeURIComponent(path),{headers:{Accept:'application/json'}}),data=await response.json();if(!response.ok)throw new Error(data.error?.message||data.error||`读取失败（HTTP ${response.status}）`);document.querySelector('#content').textContent=data.text;document.querySelector('#meta').textContent=data.truncated?'文件较大，当前显示前 20,000 个字符；下载可获得完整原文件。':'已显示完整预览内容。'}catch(error){document.querySelector('#meta').textContent='无法显示文件';document.querySelector('#content').className='error';document.querySelector('#content').textContent=error.message}})();
  </script>
</body>
</html>
