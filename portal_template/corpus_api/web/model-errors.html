<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型失败条目与重跑</title><style>body{font:15px/1.6 system-ui;background:#f1f5f3;color:#18302d;max-width:1200px;margin:32px auto;padding:20px}section{background:white;border-radius:16px;padding:24px}button,input{font:inherit;padding:9px;border:1px solid #abc2bb;border-radius:8px}button{cursor:pointer;background:#176a63;color:white}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left;overflow-wrap:anywhere}#note{white-space:pre-wrap}input[type=password]{width:320px}</style></head><body><section><h1>模型失败条目与重跑</h1><p>失败条目保留输入与错误记录，其他条目继续加工。选择需要重跑的条目，并输入对应服务的 API Key；成功请求写入重跑记录及可用缓存。然后从原流程断点继续，校验并合并结果。</p><p>不同服务的条目请分批选择。密钥不保存。话题审核分支也可直接使用原工作台的“重跑失败项 / 继续运行”，成功聚类会跳过。</p><input id="key" type="password" autocomplete="off" placeholder="所选服务的 API Key"><button id="retry">重跑所选失败项</button> <button id="refresh">刷新列表</button><div id="note" role="status"></div><p><button id="prev">上一页</button> <span id="pageInfo"></span> <button id="next">下一页</button></p><table><thead><tr><th>选择</th><th>环节 / 模型</th><th>条目</th><th>状态</th><th>错误</th></tr></thead><tbody id="rows"></tbody></table></section><script>
const $=id=>document.getElementById(id);let busy=false,page=1;
async function api(path,opt={}){const response=await fetch(path,opt);const data=await response.json();if(!response.ok)throw new Error(data.detail||'请求失败');return data}
async function load(){const data=await api('/api/model-errors?page='+page),selected=new Set([...document.querySelectorAll('tbody input:checked')].map(x=>x.value));$('pageInfo').textContent=`第 ${page} 页，共 ${data.total} 条`;$('prev').disabled=page<=1;$('next').disabled=page*100>=data.total;$('rows').replaceChildren();for(const row of data.items){const tr=document.createElement('tr'),select=document.createElement('td'),box=document.createElement('input');box.type='checkbox';box.value=row.id;box.checked=selected.has(row.id);box.disabled=['queued','retrying','replayed'].includes(row.status);select.append(box);tr.append(select);for(const value of [row.stage+' / '+row.model,row.document_id||row.sentence_id||(row.task_index??row.id.slice(0,12)),row.status,row.error||'重跑请求已成功，等待原流程校验合并']){const td=document.createElement('td');td.textContent=String(value);tr.append(td)}$('rows').append(tr)}}
$('retry').onclick=async()=>{if(busy)return;const ids=[...document.querySelectorAll('tbody input:checked')].map(x=>x.value),api_key=$('key').value;if(!ids.length||!api_key){$('note').textContent='请选择条目并填写对应 API Key';return}busy=true;$('retry').disabled=true;try{const result=await api('/api/model-errors/retry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids,api_key})});$('note').textContent=result.message;$('key').value='';await load()}catch(error){$('note').textContent=error.message}finally{busy=false;$('retry').disabled=false}};$('prev').onclick=()=>{if(page>1)page--;load().catch(e=>$('note').textContent=e.message)};$('next').onclick=()=>{page++;load().catch(e=>$('note').textContent=e.message)};$('refresh').onclick=()=>load().catch(e=>$('note').textContent=e.message);load().catch(e=>$('note').textContent=e.message);setInterval(()=>load().catch(()=>{}),10000);
</script></body></html>
