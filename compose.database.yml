services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?configure .env}
      POSTGRES_USER: ${DB_USER:?configure .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?configure .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - registry:/var/lib/postgresql/data
volumes:
  registry:
